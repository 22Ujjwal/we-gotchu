name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local tooling tests when present
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tools/team-coordination/*.test.mjs tools/local-rehearsal/*.test.mjs)
          if ((${#tests[@]})); then
            node --test "${tests[@]}"
          else
            echo 'No local tooling tests are present.'
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
